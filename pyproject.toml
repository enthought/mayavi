[build-system]
requires = [
    "setuptools>=77",
    "setuptools_scm>=8",
    "vtk>=9.4",
    "numpy",
]
build-backend = "setuptools.build_meta"

[project]
name = "mayavi"
# dependencies computed in setup.py: wheels cap VTK at the build-time
# version's next minor, the sdist stays uncapped (PEP 643)
dynamic = ["version", "dependencies"]
description = "3D scientific data visualization library and application"
readme = "README.rst"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = [
    "LICENSE.txt",
    "LICENSE_COLORBREWER.txt",
    "LICENSE_YORICK.txt",
]
authors = [
    {name = "Prabhu Ramachandran, et al.", email = "prabhu@aero.iitb.ac.in"},
]
maintainers = [
    {name = "ETS Developers", email = "mayavi-users@lists.sf.net"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
]
[project.optional-dependencies]
app = [
    "envisage",
    # envisage.api imports pkg_resources, which setuptools 82 removed, and
    # envisage requires a bare "setuptools" so nothing holds it back.  The import
    # is gone from envisage main (enthought/envisage#548) but not from 7.0.4, so
    # drop this once a release carries the fix -- see tvtk/WORKAROUNDS.md, and
    # the warning filters in mayavi/tests/conftest.py that go with it.
    # TODO: drop this once the envisage floor can be raised past 7.0.4.  The
    # tests.yml `ets: main` row already runs against a fixed envisage, so that
    # row is where the pin becoming unnecessary will show up first.
    "setuptools<82",
]

# For running the suites and for building the docs (see the CI and Docs
# workflows).  Not extras: none of this is a feature of the installed package.
# numpy and vtk are missing on purpose -- they are build requirements and so
# have to be installed ahead of the package, and CI pins them per matrix row.
[dependency-groups]
test = [
    "coverage[toml]>=7.10",  # 7.10 is where [run] patch arrived
    "pillow",         # integrationtests' texture and text3d cases read images
    "pytest",
    "pytest-timeout",
]
docs = [
    "docutils",     # mlab_reference.py validates docstrings with it directly
    "matplotlib",   # used by the mlab_3D_to_2D example
    "networkx",     # used by the delaunay_graph example
    "pillow",       # render_images.py trims the rendered figures
    "pyside6",      # rendering the gallery needs a real toolkit
    "scipy",        # used by the spherical_harmonics example
    "sphinx",
]

[project.urls]
Homepage = "https://github.com/enthought/mayavi"
Documentation = "https://docs.enthought.com/mayavi/"
Source = "https://github.com/enthought/mayavi"
Issues = "https://github.com/enthought/mayavi/issues"

[project.gui-scripts]
mayavi2 = "mayavi.scripts.mayavi2:main"
tvtk_doc = "tvtk.tools.tvtk_doc:main"

[project.entry-points."envisage.plugins"]
"tvtk.scene" = "tvtk.plugins.scene.scene_plugin:ScenePlugin"
"tvtk.scene_ui" = "tvtk.plugins.scene.ui.scene_ui_plugin:SceneUIPlugin"
"tvtk.browser" = "tvtk.plugins.browser.browser_plugin:BrowserPlugin"
mayavi = "mayavi.plugins.mayavi_plugin:MayaviPlugin"
mayavi_ui = "mayavi.plugins.mayavi_ui_plugin:MayaviUIPlugin"

[project.entry-points."tvtk.toolkits"]
qt4 = "tvtk.pyface.ui.qt4.init:toolkit_object"
qt = "tvtk.pyface.ui.qt4.init:toolkit_object"
wx = "tvtk.pyface.ui.wx.init:toolkit_object"
null = "tvtk.pyface.ui.null.init:toolkit_object"

[tool.setuptools]
include-package-data = true
# NOTE: tvtk/tvtk_classes.zip is generated at build time from the installed VTK
# (see the MyBuildPy hook in setup.py) and is excluded from the sdist by
# MANIFEST.in.  It cannot be collected as package data (it does not exist when
# the manifest is computed), so the build hook stages it into build_lib itself.

[tool.setuptools.packages.find]
include = ["mayavi*", "tvtk*"]
namespaces = true

# Version is derived from git tags (e.g. "4.8.3"); at runtime mayavi/__init__.py
# reads it from the installed package metadata (see below).
[tool.setuptools_scm]

# Coverage is informational (see codecov.yml); nothing here fails a build.
# This replaced a .coveragerc, which quietly won over pyproject.toml -- so keep
# the settings here and do not reintroduce one.
[tool.coverage.run]
branch = true
# source_pkgs + relative_files, not `source`, so that the XML carries one empty
# <source> and fully qualified names like `mayavi/api.py`.  With two `source`
# directories the names come out relative to each (a bare `api.py`), and the ten
# paths that exist under both packages -- __init__.py, api.py, version.py,
# tools/mlab.py ... -- are then ambiguous for codecov to attribute.
relative_files = true
source_pkgs = ["mayavi", "tvtk"]
omit = [
    # generated at build time from the installed VTK.  The `*tvtk_classes*` this
    # replaces never matched: coverage's `*` stops at a path separator, so a
    # pattern with no `/` only ever matches a bare basename.
    "*/tvtk_classes.zip/*",
    "*/tvtk_classes/*",
    "*/tests/*",
    "setup.py",
]
# Nothing in the package or the suites uses threads or multiprocessing, so the
# default `concurrency` is right -- but almost everything interesting happens in
# a *subprocess*: the integration suite runs one Mayavi2 application per script,
# and the off screen and toolkit tests each probe process-global state in a
# fresh interpreter.  Measure those too and combine afterwards, or the code they
# exercise reads as never imported.  `patch` supersedes the hand-rolled
# COVERAGE_PROCESS_CONFIG plumbing in test_offscreen_rendering.py, which stays
# because it also covers a run started without this config; process_startup() is
# idempotent, so a child reached by both paths still starts coverage once.
parallel = true          # required: several processes write concurrently
patch = ["subprocess", "_exit"]  # fork/execv are not available on Windows

# wheel.yml measures the *installed* package, so its data records absolute
# site-packages paths (relative_files cannot relativize what is outside the
# tree), which codecov has nothing in the repo to attribute to.  Map them back
# onto the source tree; the first entry of each list is what combine keeps.
# Being relative, those first entries only resolve if `coverage combine` runs
# in a directory that has `mayavi/` and `tvtk/` -- hence the working-directory
# on wheel.yml's combine step.
[tool.coverage.paths]
mayavi = ["mayavi", "*/site-packages/mayavi"]
tvtk = ["tvtk", "*/site-packages/tvtk"]

[tool.coverage.report]
ignore_errors = true
# `exclude_also` adds to coverage's defaults; the `exclude_lines` this grew out
# of replaced them, which is why "pragma: no cover" had to be restated there
exclude_also = [
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.pytest.ini_options]
addopts = "--durations=20 -ra --tb=short"
# Warning filters live in mayavi/tests/conftest.py and tvtk/tests/conftest.py,
# which unlike this file also reach a `pytest --pyargs` run against the wheel
