name: CI
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, mostly to catch breakage in VTK dev wheels
    - cron: "38 4 * * 1"

jobs:
  tests:
    name: Tests ${{ matrix.os }} ${{ matrix.python-version }} ${{ matrix.qt-api }} ${{ matrix.vtk }} ${{ (matrix.headless && 'headless') || ''}}
    strategy:
      matrix:
        # Always test against the latest VTK, NumPy, and Qt bindings
        os: [ubuntu-latest, windows-latest, macos-26-intel, macos-latest]
        python-version: ['3.14']
        qt-api: ['pyside6']  # prefer the modern bindings
        headless: [false]
        # Empty means "latest", which the install step spells as `vtk`.  This
        # has to be a matrix key rather than left to the includes: an include
        # that overwrites no *original* matrix value is merged into the
        # combinations it matches instead of adding one, so with vtk known only
        # to the includes, `vtk: vtk-dev` was absorbed into the base ubuntu row
        # and there was no ubuntu job on the latest release at all.
        vtk: ['']
        # Then add some backward compat checks
        include:
          - python-version: '3.13'
            qt-api: 'pyside6'
            os: ubuntu-latest
            vtk: 'vtk==9.6.*'
          - python-version: '3.12'
            qt-api: 'pyside6'
            os: ubuntu-latest
            vtk: 'vtk==9.5.*'
            numpy: 'numpy==2.3.*' # in1d (used by vtk) removed in 2.4+
          - python-version: '3.11'
            qt-api: 'pyqt6'
            os: ubuntu-latest
            vtk: 'vtk==9.4.*'
            numpy: 'numpy==2.3.*'
          # Oldest supported Python, VTK, and Qt bindings
          - python-version: '3.10'
            qt-api: 'pyqt5'
            os: ubuntu-latest
            vtk: 'vtk==9.4.*'
          # No display server / Qt toolkit at all
          - python-version: '3.14'
            os: ubuntu-latest
            headless: true
          # Pre-release (dev) VTK wheels from https://wheels.vtk.org
          - python-version: '3.14'
            qt-api: 'pyside6'
            os: ubuntu-latest
            vtk: 'vtk-dev'
          # Linux arm64: plain C char is unsigned there (unlike x86 and
          # unlike Apple's arm64 ABI), which is what broke gh-1194
          - python-version: '3.14'
            qt-api: 'pyside6'
            os: ubuntu-24.04-arm
      fail-fast: false
    defaults:
      run:
        shell: bash
    timeout-minutes: 30  # these usually take < 8 minutes

    runs-on: ${{ matrix.os }}

    env:
      ETS_TOOLKIT: ${{ matrix.headless && 'null' || 'qt4' }}
      QT_API: ${{ matrix.qt-api }}
      TVTK_VERBOSE: 'true'
      VTK_PARSER_VERBOSE: 'true'
      PYTHONUNBUFFERED: '1'

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
        # setuptools_scm derives the version from git tags, which a shallow
        # clone does not have (the version would come out as "0.0.0")
        fetch-depth: 0
    - uses: pyvista/setup-headless-display-action@v4
      with:
        qt: true
      if: matrix.headless != true
    # The row above gets libegl1 and libosmesa6 from that action, so the
    # off screen tests can force each of VTK's backends in turn.  The headless
    # row skips it and would have no way to make a GL context at all -- which
    # is the one configuration where EGL/OSMesa is not a fallback but the only
    # option, so it is the row that most needs them.
    - run: sudo apt-get update && sudo apt-get install -y libegl1 libosmesa6
      if: matrix.headless == true
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      id: install
      run: |
        # setuptools_scm is a build requirement, and we install below with
        # --no-build-isolation, so it must be present in the environment
        python -m pip install --upgrade pip setuptools setuptools_scm wheel
        if [[ "${{ matrix.vtk }}" == "vtk-dev" ]]; then
          # Dev wheels get their own pip calls so that --pre and the nightly
          # indexes apply only to the package they belong to
          python -m pip install --upgrade --pre --only-binary ":all:" --extra-index-url "https://wheels.vtk.org" vtk
          python -m pip install --upgrade --pre --only-binary ":all:" --extra-index-url "https://pypi.anaconda.org/scientific-python-nightly-wheels/simple" numpy
          vtk_spec=""
          numpy_spec=""
        else
          vtk_spec="${{ matrix.vtk || 'vtk' }}"
          numpy_spec="${{ matrix.numpy || 'numpy' }}"
        fi
        # only what this row pins or what has to precede the build; everything
        # else comes from the package and the `test` group below
        python -m pip install --upgrade ${{ matrix.qt-api || ''}} $numpy_spec $vtk_spec --only-binary="numpy,vtk"
        python -c "import vtk; print(f'VTK {vtk.VTK_VERSION}')"
        python -c "import numpy; print(f'NumPy {numpy.__version__}')"
        if [[ "${{ matrix.headless }}" != "true" ]]; then
          echo "extra=[app]" | tee -a $GITHUB_OUTPUT
        fi
    - run: python -m pip install --no-build-isolation --group test -ve .${{ steps.install.outputs.extra }}
    # `coverage run` rather than pytest-cov: there are two suites per job plus
    # the subprocesses they spawn, and pytest-cov combines at the end of each
    # run, which would consume the children's data before the explicit combine
    # below can see all of it.  `parallel = true` keeps the runs from clobbering
    # one another.
    - run: coverage run -m pytest -v --timeout=10 mayavi
    - run: coverage run -m pytest -sv --timeout=60 tvtk
    - name: Combine coverage
      if: '!cancelled()'
      run: |
        coverage combine
        coverage xml
        coverage report --show-missing --skip-covered
    - uses: codecov/codecov-action@v7.0.0
      if: '!cancelled()'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        # informational only, and the token is not registered yet -- a failed
        # upload must not fail the job
        fail_ci_if_error: false

  # A job of its own rather than a step on a `tests` row.  Each of these stands
  # the Mayavi2 application up in a subprocess, so they want a display and the
  # [app] extra, and at ~2 min they are slower than the suites above -- but the
  # deciding reason is that a step conditioned on the matrix stops running in
  # silence when the matrix moves under it, which is exactly what happened when
  # this was first written as one.  A job that stops running is a check that is
  # visibly no longer there.
  #
  # One configuration is enough: these exercise the Mayavi2 application, not
  # the VTK version, which the matrix above already covers.
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 20  # the suite takes about two minutes
    env:
      ETS_TOOLKIT: qt4
      QT_API: pyside6
      PYTHONUNBUFFERED: '1'
    steps:
    - uses: actions/checkout@v7.0.0
      with:
        persist-credentials: false
        fetch-depth: 0  # setuptools_scm needs the tags
    - uses: pyvista/setup-headless-display-action@v4
      with:
        qt: true
    - uses: actions/setup-python@v6.3.0
      with:
        python-version: '3.14'
    # Unlike the matrix above this pins nothing, so there is no reason to keep
    # the build out of isolation: letting it fetch its own VTK gets the same
    # release the runtime does, as in docs.yml.  That leaves numpy, vtk and the
    # build requirements to be resolved for us; pyside6 is the only thing the
    # package does not ask for itself.
    - run: python -m pip install --upgrade pip  # --group needs pip >= 25.1
    - run: python -m pip install --group test pyside6 -ve ".[app]"
    - run: python -c "import vtk; print(f'VTK {vtk.VTK_VERSION}')"
    # the wrapper sets its own per-script subprocess timeout; pytest's is the
    # backstop behind it.  Every case here *is* a subprocess, so this job only
    # reports anything at all because of `patch = ["subprocess"]`.
    - run: coverage run -m pytest -v --timeout=360 integrationtests
    - name: Combine coverage
      if: '!cancelled()'
      run: |
        coverage combine
        coverage xml
        coverage report --show-missing --skip-covered
    - uses: codecov/codecov-action@v7.0.0
      if: '!cancelled()'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        fail_ci_if_error: false

  # Scheduled runs have no associated PR where a failure would be noticed, so
  # open an issue (if there isn't one already) when they break
  issue-on-failure:
    name: Open issue on scheduled failure
    needs: [tests, integration]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    # a local action has to be checked out before it can be used
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: .github/actions
    - uses: ./.github/actions/open-issue
      with:
        token: ${{ github.token }}
        title: Scheduled CI run is failing
        body: |
          The weekly scheduled CI run failed. Since these runs test against the
          latest dependencies (including VTK dev wheels), this probably means a
          dependency update broke something.
