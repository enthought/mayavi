name: CI
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, mostly to catch breakage in VTK dev wheels
    - cron: "38 4 * * 1"

jobs:
  tests:
    # TEMPORARY: drop before merge -- keeps CI cycles for the docs
    # build while the wx rendering is still being worked out
    if: github.head_ref != 'wx-examples'
    name: Tests ${{ matrix.os }} ${{ matrix.python-version }} ${{ matrix.qt-api }} ${{ matrix.vtk }} ${{ (matrix.headless && 'headless') || ''}}
    strategy:
      matrix:
        # Always test against the latest VTK, NumPy, and Qt bindings
        os: [ubuntu-latest, windows-latest, macos-26-intel, macos-latest]
        python-version: ['3.14']
        qt-api: ['pyside6']  # prefer the modern bindings
        headless: [false]
        # Then add some backward compat checks
        include:
          - python-version: '3.13'
            qt-api: 'pyside6'
            os: ubuntu-latest
            vtk: 'vtk==9.6'
          - python-version: '3.12'
            qt-api: 'pyside6'
            os: ubuntu-latest
            vtk: 'vtk==9.5'
            numpy: 'numpy==2.3' # in1d (used by vtk) removed in 2.4+
          - python-version: '3.11'
            qt-api: 'pyqt6'
            os: ubuntu-latest
            vtk: 'vtk==9.4'
            numpy: 'numpy==2.3'
          # Oldest supported Python, VTK, and Qt bindings
          - python-version: '3.10'
            qt-api: 'pyqt5'
            os: ubuntu-latest
            vtk: 'vtk==9.4'
          # No display server / Qt toolkit at all
          - python-version: '3.14'
            os: ubuntu-latest
            headless: true
          # Pre-release (dev) VTK wheels from https://wheels.vtk.org
          - python-version: '3.14'
            qt-api: 'pyside6'
            os: ubuntu-latest
            vtk: 'vtk-dev'
      fail-fast: false
    defaults:
      run:
        shell: bash
    timeout-minutes: 30  # these usually take < 8 minutes

    runs-on: ${{ matrix.os }}

    env:
      ETS_TOOLKIT: ${{ matrix.headless && 'null' || 'qt4' }}
      QT_API: ${{ matrix.qt-api }}
      TVTK_VERBOSE: 'true'
      VTK_PARSER_VERBOSE: 'true'
      PYTHONUNBUFFERED: '1'

    steps:
    - uses: actions/checkout@v7.0.0
      with:
        persist-credentials: false
        # setuptools_scm derives the version from git tags, which a shallow
        # clone does not have (the version would come out as "0.0.0")
        fetch-depth: 0
    - uses: pyvista/setup-headless-display-action@v4
      with:
        qt: true
      if: matrix.headless != true
    - uses: actions/setup-python@v6.3.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      id: install
      run: |
        # setuptools_scm is a build requirement, and we install below with
        # --no-build-isolation, so it must be present in the environment
        python -m pip install --upgrade pip setuptools setuptools_scm wheel
        if [[ "${{ matrix.vtk }}" == "vtk-dev" ]]; then
          # Dev wheels get their own pip calls so that --pre and the nightly
          # indexes apply only to the package they belong to
          python -m pip install --upgrade --pre --only-binary ":all:" --extra-index-url "https://wheels.vtk.org" vtk
          python -m pip install --upgrade --pre --only-binary ":all:" --extra-index-url "https://pypi.anaconda.org/scientific-python-nightly-wheels/simple" numpy
          vtk_spec=""
          numpy_spec=""
        else
          vtk_spec="${{ matrix.vtk || 'vtk' }}"
          numpy_spec="${{ matrix.numpy || 'numpy' }}"
        fi
        python -m pip install --upgrade ${{ matrix.qt-api || ''}} $numpy_spec $vtk_spec pillow pytest pytest-timeout traits traitsui --only-binary="numpy,vtk"
        python -c "import vtk; print(f'VTK {vtk.VTK_VERSION}')"
        python -c "import numpy; print(f'NumPy {numpy.__version__}')"
        if [[ "${{ matrix.headless }}" != "true" ]]; then
          echo "extra=[app]" | tee -a $GITHUB_OUTPUT
        fi
    - run: python -m pip install --no-build-isolation -ve .${{ steps.install.outputs.extra }}
    - run: pytest -v --timeout=10 mayavi
    - run: pytest -sv --timeout=60 tvtk

  # Scheduled runs have no associated PR where a failure would be noticed, so
  # open an issue (if there isn't one already) when they break
  issue-on-failure:
    name: Open issue on scheduled failure
    needs: tests
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    # a local action has to be checked out before it can be used
    - uses: actions/checkout@v7.0.0
      with:
        persist-credentials: false
        sparse-checkout: .github/actions
    - uses: ./.github/actions/open-issue
      with:
        token: ${{ github.token }}
        title: Scheduled CI run is failing
        body: |
          The weekly scheduled CI run failed. Since these runs test against the
          latest dependencies (including VTK dev wheels), this probably means a
          dependency update broke something.
