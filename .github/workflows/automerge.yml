name: Bot auto-merge
on: pull_request

jobs:
  autobot:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    # Names can be found with gh api /repos/enthought/mayavi/pulls/1430 -q .user.login for example
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'enthought/mayavi'
    steps:
      - name: Enable auto-merge for bot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
