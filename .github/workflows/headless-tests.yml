name: Headless tests
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true

on:
  pull_request:
  schedule:
    # Run test at 0400 UTC on Saturday.
    - cron: '0 4 * * 6'

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.14']
      fail-fast: false

    runs-on: ${{ matrix.os }}
    env:
      VTK_PARSER_VERBOSE: 'true'
      ETS_TOOLKIT: 'null'

    steps:
    - uses: actions/checkout@v7.0.0
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.3.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install numpy vtk pillow pytest pytest-timeout traitsui
    - run: python -m pip install --no-build-isolation -ve .
    - run: pytest -v --timeout=10 --pyargs mayavi
    - run: pytest -v --timeout=60 --pyargs tvtk
